name: Deploy Frontend to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi
          echo "Build OK — $(du -sh dist/ | cut -f1) total"

      - name: Deploy dist/ to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VRI_SERVER_HOST }}
          username: ${{ secrets.VRI_SERVER_USER }}
          key:      ${{ secrets.VRI_SSH_KEY }}
          source:   "dist/*"
          target:   "/opt/vrinspector/frontend/dist/"
          strip_components: 1

      - name: Fix file permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VRI_SERVER_HOST }}
          username: ${{ secrets.VRI_SERVER_USER }}
          key:      ${{ secrets.VRI_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /opt/vrinspector/frontend/dist/
            echo "Permissions set ✓"

      - name: Smoke test — staging.vrinspector.com
        run: |
          sleep 3
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://staging.vrinspector.com)
          if [ "$HTTP" != "200" ]; then echo "FAILED — HTTP $HTTP"; exit 1; fi
          echo "✅ HTTP $HTTP — staging is up"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Frontend deploy failed."
